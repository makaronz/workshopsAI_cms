# High-Performance Docker Compose Configuration
# Optimized for production workloads with advanced scaling and monitoring

version: '3.8'

services:
  # Main application with performance optimizations
  app:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
        NODE_ENV: production
    image: workshopsai-cms:${VERSION:-latest}
    container_name: workshopsai-cms
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=1024
      - UV_THREADPOOL_SIZE=16
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-workshopsai}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-workshopsai_cms}
      - DATABASE_URL=postgresql://${DB_USER:-workshopsai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-workshopsai_cms}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://workshopsai.com}
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - PERFORMANCE_MONITORING=true
      - ENABLE_PROFILING=${ENABLE_PROFILING:-false}
    volumes:
      - uploads:/app/uploads:rw,noexec,nosuid,nodev
      - logs:/app/logs:rw,noexec,nosuid,nodev
      - backups:/app/backups:rw,noexec,nosuid,nodev
      - /tmp:/tmp:rw,noexec,nosuid,nodev,size=1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workshopsai-network
    deploy:
      replicas: ${APP_REPLICAS:-3}
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 1000
        reservations:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
        monitor: 60s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.workshopsai.rule=Host(`${DOMAIN:-workshopsai.com}`)"
        - "traefik.http.routers.workshopsai.tls=true"
        - "traefik.http.routers.workshopsai.tls.certresolver=letsencrypt"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Performance optimizations
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 32768
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
      - net.ipv4.tcp_fin_timeout=15

  # PostgreSQL with performance tuning
  postgres:
    image: postgres:15-alpine
    container_name: workshopsai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-workshopsai_cms}
      - POSTGRES_USER=${DB_USER:-workshopsai}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGTUNE=web
      - MAX_CONNECTIONS=200
      - SHARED_BUFFERS=256MB
      - EFFECTIVE_CACHE_SIZE=1GB
      - WORK_MEM=8MB
      - MAINTENANCE_WORK_MEM=128MB
      - CHECKPOINT_COMPLETION_TARGET=0.9
      - WAL_BUFFERS=16MB
      - DEFAULT_STATISTICS_TARGET=100
      - RANDOM_PAGE_COST=1.1
      - EFFECTIVE_IO_CONCURRENCY=200
      - LOG_MIN_DURATION_STATEMENT=1000
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw,noexec,nosuid,nodev
      - ./migrations/001_initial_postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./migrations/002_data_migration_mysql_to_postgresql.sql:/docker-entrypoint-initdb.d/02_migration.sql:ro
      - ./migrations/performance_indexes.sql:/docker-entrypoint-initdb.d/03_performance.sql:ro
      - postgres_backups:/backups:rw,noexec,nosuid,nodev
      - postgres_conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 1000
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-workshopsai} -d ${DB_NAME:-workshopsai_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_statement=all
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_temp_files=0
      -c track_activities=on
      -c track_counts=on
      -c track_io_timing=on
      -c track_functions=pl
      -c pg_stat_statements.track=all

  # Redis with performance optimization
  redis:
    image: redis:7-alpine
    container_name: workshopsai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data:rw,noexec,nosuid,nodev
      - ./redis/performance.conf:/etc/redis/redis.conf:ro
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
          pids: 1000
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    command: redis-server /etc/redis/redis.conf
    sysctls:
      - net.core.somaxconn=65535

  # Nginx with performance tuning and caching
  nginx:
    image: nginx:alpine
    container_name: workshopsai-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/performance.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod-performance.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx:rw,noexec,nosuid,nodev
      - nginx_ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx:rw,noexec,nosuid,nodev
    depends_on:
      - app
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 1000
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Enhanced monitoring with Grafana and Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: workshopsai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.performance.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus:rw,noexec,nosuid,nodev
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
          pids: 1000
        reservations:
          cpus: '0.5'
          memory: 1G
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.max-connections=512'
      - '--query.max-concurrency=20'
      - '--query.timeout=2m'

  grafana:
    image: grafana/grafana:latest
    container_name: workshopsai-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_DATABASE_MAX_IDLE_CONN=10
      - GF_DATABASE_MAX_OPEN_CONN=100
    volumes:
      - grafana_data:/var/lib/grafana:rw,noexec,nosuid,nodev
      - ./monitoring/grafana/performance-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
          pids: 1000
        reservations:
          cpus: '0.25'
          memory: 512M

  # Enhanced monitoring with Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: workshopsai-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 1000
        reservations:
          cpus: '0.1'
          memory: 256M
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # Log aggregation with Loki
  loki:
    image: grafana/loki:latest
    container_name: workshopsai-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki-performance-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki:rw,noexec,nosuid,nodev
    networks:
      - workshopsai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
          pids: 1000
        reservations:
          cpus: '0.25'
          memory: 512M
    command: -config.file=/etc/loki/local-config.yaml

  # Performance testing with custom metrics
  performance-tester:
    build:
      context: .
      dockerfile: Dockerfile.performance
    container_name: workshopsai-perf-tester
    restart: "no"
    environment:
      - TARGET_URL=http://app:3001
      - CONCURRENT_USERS=${CONCURRENT_USERS:-100}
      - TEST_DURATION=${TEST_DURATION:-5m}
      - RAMP_UP_TIME=${RAMP_UP_TIME:-1m}
    networks:
      - workshopsai-network
    depends_on:
      - app
    profiles:
      - testing

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-./data/postgres}
      size: 50G

  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_BACKUPS_PATH:-./data/backups/postgres}
      size: 20G

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}
      size: 10G

  uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${UPLOADS_PATH:-./data/uploads}
      size: 30G

  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}
      size: 5G

  backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUPS_PATH:-./data/backups}
      size: 20G

  nginx_ssl:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSL_PATH:-./data/ssl}

  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NGINX_LOGS_PATH:-./data/logs/nginx}
      size: 5G

  nginx_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NGINX_CACHE_PATH:-./data/cache/nginx}
      size: 10G

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROMETHEUS_DATA_PATH:-./data/prometheus}
      size: 20G

  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_DATA_PATH:-./data/grafana}
      size: 5G

  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOKI_DATA_PATH:-./data/loki}
      size: 10G

  postgres_conf:
    driver: local

networks:
  workshopsai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: workshopsai-br
      com.docker.network.driver.mtu: 1500