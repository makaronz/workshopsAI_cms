name: workshopsai-cms
region: fra  # Frankfurt (najbliżej Polski)

# Web Service - Backend API
services:
  - name: workshopsai-backend
    github:
      repo: makaronz/workshopsAI_cms
      branch: main
      deploy_on_push: true
    
    # Build configuration
    build_command: npm install && npm run build
    
    # Run configuration
    run_command: npm start
    
    # Environment
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs  # 1 vCPU, 0.5GB RAM - $5/mies
    
    # HTTP Port (DigitalOcean automatycznie ustawi PORT env var)
    http_port: 3010
    
    # Health check
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    
    # Environment variables
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      
      # Database connection - DigitalOcean automatycznie ustawi DATABASE_URL
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      
      # OpenAI API Key - ustaw ręcznie w dashboard
      - key: OPENAI_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      
      # JWT Secret - wygeneruj bezpieczny klucz (minimum 32 znaki)
      - key: JWT_SECRET
        value: ""
        scope: RUN_TIME
        type: SECRET
      
      # JWT Configuration
      - key: JWT_EXPIRES_IN
        value: "7d"
        scope: RUN_TIME
        type: GENERAL
      
      - key: REFRESH_TOKEN_SECRET
        value: ""
        scope: RUN_TIME
        type: SECRET
      
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: "30d"
        scope: RUN_TIME
        type: GENERAL
      
      # CORS - zmień na swoją domenę po deployment
      - key: CORS_ORIGIN
        value: "*"
        scope: RUN_TIME
        type: GENERAL
      
      # Session Secret
      - key: SESSION_SECRET
        value: ""
        scope: RUN_TIME
        type: SECRET
      
      # Logging
      - key: LOG_LEVEL
        value: "info"
        scope: RUN_TIME
        type: GENERAL

# Managed Databases
databases:
  # PostgreSQL Database
  - name: db
    engine: PG
    version: "15"
    production: true
    db_name: workshopsai_cms
    db_user: workshopsai

