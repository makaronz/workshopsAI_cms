name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: "0 2 * * *"

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test across multiple browsers
        browser: [chromium, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run playwright:install-browsers

      - name: Build application
        run: npm run build
        continue-on-error: true

      - name: Start application
        run: |
          npm run dev &
          # Wait for application to start
          timeout 60 bash -c 'until curl -f http://localhost:3001/health || curl -f http://localhost:3001; do sleep 2; done' || true

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BASE_URL: http://localhost:3001
          NODE_ENV: test
          CI: true

      - name: Run accessibility tests
        run: npx playwright test --project=accessibility
        env:
          BASE_URL: http://localhost:3001
          NODE_ENV: test
          CI: true

      - name: Generate test report
        if: always()
        run: npm run test:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.browser }}
          path: coverage/
          retention-days: 30

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run playwright:install-browsers

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run dev &
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Run performance tests
        run: npx playwright test --project=performance
        env:
          BASE_URL: http://localhost:3001
          NODE_ENV: test
          CI: true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            test-results/
            lighthouse-results/
          retention-days: 30

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Install Playwright browsers
        run: npm run playwright:install-browsers

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run dev &
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Run security E2E tests
        run: npm run test:security
        env:
          BASE_URL: http://localhost:3001
          NODE_ENV: test
          CI: true

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run playwright:install-browsers

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run dev &
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'

      - name: Run smoke tests
        run: npx playwright test --grep="smoke"
        env:
          BASE_URL: http://localhost:3001
          NODE_ENV: test
          CI: true

  # Job to merge and publish test results
  merge-results:
    name: Merge Test Results
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-tests, smoke-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Merge test reports
        run: |
          mkdir -p merged-results
          find . -name "*.json" -path "*/test-results/*" -exec cp {} merged-results/ \;
          find . -name "*.xml" -path "*/test-results/*" -exec cp {} merged-results/ \;

      - name: Generate summary report
        run: |
          echo "# Test Results Summary" > test-results-summary.md
          echo "" >> test-results-summary.md
          echo "## E2E Tests" >> test-results-summary.md
          echo "- Browser compatibility tests" >> test-results-summary.md
          echo "- Accessibility tests" >> test-results-summary.md
          echo "- Authentication flows" >> test-results-summary.md
          echo "" >> test-results-summary.md
          echo "## Performance Tests" >> test-results-summary.md
          echo "- Page load performance" >> test-results-summary.md
          echo "- Core Web Vitals" >> test-results-summary.md
          echo "" >> test-results-summary.md
          echo "## Security Tests" >> test-results-summary.md
          echo "- Authentication security" >> test-results-summary.md
          echo "- XSS protection" >> test-results-summary.md
          echo "- CSRF protection" >> test-results-summary.md

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-results
          path: |
            merged-results/
            test-results-summary.md
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🧪 E2E Test Results\n\n';

            // Add summary if it exists
            if (fs.existsSync('test-results-summary.md')) {
              const summary = fs.readFileSync('test-results-summary.md', 'utf8');
              comment += summary;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
