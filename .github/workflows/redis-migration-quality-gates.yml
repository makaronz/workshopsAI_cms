name: Redis Migration Quality Gates

on:
  push:
    branches: [feature/redis-elimination*, develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '20'
  TEST_TIMEOUT: 300000
  ARTILLERY_TIMEOUT: 600000

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          # Install migration dependencies
          npm install node-cache
          npm uninstall ioredis redis bullmq @bull-board/api @bull-board/express connect-redis @socket.io/redis-adapter

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Run migration-specific unit tests
        run: npm test -- tests/redis-migration/unit/
        env:
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install node-cache
          npm uninstall ioredis redis bullmq

      - name: Setup database
        run: |
          npm run db:generate
          npm run db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run migration integration tests
        run: npm test -- tests/redis-migration/integration/
        env:
          CI: true
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # Performance Benchmarks
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install node-cache
          npm uninstall ioredis redis bullmq

      - name: Run performance benchmarks
        run: npm run test:performance
        timeout-minutes: 10

      - name: Run migration benchmarks
        run: |
          npx ts-node tests/redis-migration/performance/benchmark-suite.ts
        timeout-minutes: 10

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: performance-*.json

  # Load Testing
  load-tests:
    name: Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install node-cache artillery
          npm uninstall ioredis redis bullmq

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm start &
          sleep 10
        env:
          NODE_ENV: test
          CACHE_PROVIDER: memory
          SESSION_STORE: database

      - name: Run Artillery load test
        run: |
          artillery run tests/redis-migration/load/artillery-config.yml
        env:
          TARGET_URL: http://localhost:3010
        timeout-minutes: 10

      - name: Upload load test results
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: artillery-report.html

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install node-cache
          npm uninstall ioredis redis bullmq

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Run security tests
        run: npm run test:security

      - name: Run OWASP ZAP security scan
        run: |
          npx ts-node tests/redis-migration/security/zap-security-tests.ts http://localhost:3010
        timeout-minutes: 10

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: tests/redis-migration/security/output/

  # Migration Verification
  migration-verification:
    name: Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install node-cache
          npm uninstall ioredis redis bullmq

      - name: Run migration validation
        run: |
          npx ts-node tests/redis-migration/verification/migration-validator.ts
        env:
          TEST_API_URL: http://localhost:3010

      - name: Upload validation report
        uses: actions/upload-artifact@v3
        with:
          name: migration-validation
          path: migration-validation-report.json

  # Chaos Engineering
  chaos-tests:
    name: Chaos Engineering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install node-cache
          npm uninstall ioredis redis bullmq

      - name: Run chaos tests
        run: |
          npx ts-node tests/redis-migration/chaos/chaos-engine.ts
        env:
          NODE_ENV: test

      - name: Upload chaos reports
        uses: actions/upload-artifact@v3
        with:
          name: chaos-test-results
          path: chaos-test-results/

  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Check for Redis dependencies
        run: |
          if npm list ioredis redis bullmq @bull-board/api @bull-board/express 2>/dev/null | grep -q "├\|└\|├──\|└──"; then
            echo "❌ Redis dependencies still present"
            npm list ioredis redis bullmq @bull-board/api @bull-board/express
            exit 1
          else
            echo "✅ Redis dependencies successfully removed"
          fi

      - name: Check for Redis environment variables
        run: |
          ENV_FILE=.env.example
          if [ -f "$ENV_FILE" ]; then
            if grep -q "REDIS" "$ENV_FILE"; then
              echo "⚠️ Redis environment variables still in .env.example"
              grep "REDIS" "$ENV_FILE"
            else
              echo "✅ Redis environment variables removed from .env.example"
            fi
          fi

  # Quality Gate Validation
  quality-gate:
    name: Quality Gate Validation
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, security-tests, migration-verification, code-quality]
    if: always() # Run even if some jobs failed

    steps:
      - name: Evaluate quality gates
        run: |
          # Define quality gate criteria
          UNIT_TEST_THRESHOLD=95
          INTEGRATION_TEST_THRESHOLD=95
          PERFORMANCE_THRESHOLD=1000  # ops/sec
          MAX_HIGH_VULNERABILITIES=0
          MAX_MEDIUM_VULNERABILITIES=5

          # Check if required jobs passed
          JOBS_PASSED="${{ needs.unit-tests.result }}-${{ needs.integration-tests.result }}-${{ needs.security-tests.result }}-${{ needs.migration-verification.result }}-${{ needs.code-quality.result }}"

          # Parse results (simplified for demo)
          UNIT_PASSED="${{ needs.unit-tests.result }}"
          INTEGRATION_PASSED="${{ needs.integration-tests.result }}"
          SECURITY_PASSED="${{ needs.security-tests.result }}"
          MIGRATION_PASSED="${{ needs.migration-verification.result }}"
          QUALITY_PASSED="${{ needs.code-quality.result }}"

          echo "🚦 Quality Gate Evaluation"
          echo "========================="
          echo "Unit Tests: $UNIT_PASSED"
          echo "Integration Tests: $INTEGRATION_PASSED"
          echo "Security Tests: $SECURITY_PASSED"
          echo "Migration Validation: $MIGRATION_PASSED"
          echo "Code Quality: $QUALITY_PASSED"

          # Determine overall status
          if [[ "$UNIT_PASSED" == "success" && "$INTEGRATION_PASSED" == "success" && "$SECURITY_PASSED" == "success" && "$MIGRATION_PASSED" == "success" && "$QUALITY_PASSED" == "success" ]]; then
            echo "✅ All quality gates passed"
            echo "🚀 Migration is ready for production"
          else
            echo "❌ Quality gates failed"
            echo "🛑 Migration is NOT ready for production"
            echo ""
            echo "Failed gates:"
            [[ "$UNIT_PASSED" != "success" ]] && echo "  - Unit Tests"
            [[ "$INTEGRATION_PASSED" != "success" ]] && echo "  - Integration Tests"
            [[ "$SECURITY_PASSED" != "success" ]] && echo "  - Security Tests"
            [[ "$MIGRATION_PASSED" != "success" ]] && echo "  - Migration Validation"
            [[ "$QUALITY_PASSED" != "success" ]] && echo "  - Code Quality"
            exit 1
          fi

  # Canary Deployment (Optional)
  canary-deploy:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main' && success()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging (canary)
        run: |
          echo "🚀 Deploying to staging/canary environment..."
          # Add actual deployment commands here
          # Example: kubectl apply -f k8s/canary-deployment.yml

      - name: Run smoke tests on canary
        run: |
          echo "🧪 Running smoke tests on canary..."
          # Add smoke test commands here

      - name: Promote canary to production
        if: success()
        run: |
          echo "✅ Canary passed - promoting to production"
          # Add promotion commands here

  # Summary Report
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, security-tests, migration-verification, code-quality]
    if: always()

    steps:
      - name: Generate test summary
        run: |
          echo "## Redis Migration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Validation | ${{ needs.migration-verification.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          ALL_PASSED="${{ needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.security-tests.result == 'success' && needs.migration-verification.result == 'success' && needs.code-quality.result == 'success' && 'true' || 'false' }}"
          if [[ "$ALL_PASSED" == "true" ]]; then
            echo "### ✅ All Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "The Redis migration is ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed tests before deployment." >> $GITHUB_STEP_SUMMARY
          fi