name: Redis Migration - Zero Downtime Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      migration_strategy:
        description: 'Migration strategy'
        required: true
        default: 'blue-green'
        type: choice
        options:
        - blue-green
        - canary
        - rolling
      dry_run:
        description: 'Perform dry run only'
        required: false
        default: false
        type: boolean
      verify_only:
        description: 'Verify existing migration only'
        required: false
        default: false
        type: boolean
  push:
    branches:
    - main
    - develop
    paths:
    - 'src/**'
    - 'infra/migration/**'
    - 'package.json'
  pull_request:
    branches:
    - main
    paths:
    - 'infra/migration/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOYMENT_TIMEOUT: 3600 # 1 hour
  HEALTH_CHECK_TIMEOUT: 300 # 5 minutes

jobs:
  # Pre-migration checks and validation
  pre-migration-checks:
    name: Pre-Migration Validation
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      migration_id: ${{ steps.setup.outputs.migration_id }}
      source_redis_version: ${{ steps.redis-check.outputs.source_version }}
      target_redis_version: ${{ steps.redis-check.outputs.target_version }}
      can_proceed: ${{ steps.validation.outputs.can_proceed }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup migration metadata
      id: setup
      run: |
        MIGRATION_ID="migration-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}"
        echo "migration_id=${MIGRATION_ID}" >> $GITHUB_OUTPUT
        echo "Migration ID: ${MIGRATION_ID}"

    - name: Validate Redis configurations
      id: redis-check
      run: |
        echo "Checking Redis connectivity and versions..."

        # Check source Redis
        SOURCE_VERSION=$(redis-cli -u ${{ secrets.REDIS_SOURCE_URL }} --raw info server | grep "redis_version:" | cut -d: -f2)
        echo "source_version=${SOURCE_VERSION}" >> $GITHUB_OUTPUT
        echo "Source Redis version: ${SOURCE_VERSION}"

        # Check target Redis
        TARGET_VERSION=$(redis-cli -u ${{ secrets.REDIS_TARGET_URL }} --raw info server | grep "redis_version:" | cut -d: -f2)
        echo "target_version=${TARGET_VERSION}" >> $GITHUB_OUTPUT
        echo "Target Redis version: ${TARGET_VERSION}"

        # Validate cluster status
        redis-cli -u ${{ secrets.REDIS_TARGET_URL }} --raw cluster nodes || echo "Standalone Redis detected"

    - name: Check available disk space
      run: |
        echo "Checking disk space requirements..."
        SOURCE_MEMORY=$(redis-cli -u ${{ secrets.REDIS_SOURCE_URL }} --raw info memory | grep "used_memory:" | cut -d: -f2)
        echo "Source Redis memory usage: ${SOURCE_MEMORY} bytes"

        # Calculate required disk space (2x memory size for safety)
        REQUIRED_SPACE=$((SOURCE_MEMORY * 2))
        echo "Required disk space: ${REQUIRED_SPACE} bytes"

    - name: Validate pre-requisites
      id: validation
      run: |
        CAN_PROCEED="true"

        # Check if versions are compatible
        if [[ ! "${{ steps.redis-check.outputs.source_version }}" =~ ^6\. ]] && [[ ! "${{ steps.redis-check.outputs.source_version }}" =~ ^7\. ]]; then
          echo "❌ Source Redis version is not supported"
          CAN_PROCEED="false"
        fi

        # Check if target Redis is accessible
        if ! redis-cli -u ${{ secrets.REDIS_TARGET_URL }} ping; then
          echo "❌ Target Redis is not accessible"
          CAN_PROCEED="false"
        fi

        echo "can_proceed=${CAN_PROCEED}" >> $GITHUB_OUTPUT
        echo "Pre-migration validation: ${CAN_PROCEED}"

  # Build migration image
  build-migration-image:
    name: Build Migration Image
    runs-on: ubuntu-latest
    needs: pre-migration-checks
    if: needs.pre-migration-checks.outputs.can_proceed == 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=redis-migration,enable={{is_default_branch}}
          type=raw,value=migration-${{ needs.pre-migration-checks.outputs.migration_id }}

    - name: Build and push migration image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infra/docker/Dockerfile.redis-migration
        target: migration-coordinator
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Data migration execution
  execute-migration:
    name: Execute Migration
    runs-on: ubuntu-latest
    needs: [pre-migration-checks, build-migration-image]
    if: needs.pre-migration-checks.outputs.can_proceed == 'true' && github.event.inputs.verify_only != 'true'
    environment: ${{ github.event.inputs.environment || 'staging' }}

    strategy:
      matrix:
        shard: [0, 1, 2, 3] # Adjust based on your Redis sharding

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Deploy migration coordinator
      run: |
        echo "Deploying migration coordinator for shard ${{ matrix.shard }}..."

        # Deploy to Kubernetes
        cat <<EOF | kubectl apply -f -
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: redis-migration-${{ needs.pre-migration-checks.outputs.migration_id }}-${{ matrix.shard }}
          namespace: ${{ github.event.inputs.environment || 'staging' }}
          labels:
            app: redis-migration
            migration-id: ${{ needs.pre-migration-checks.outputs.migration_id }}
            shard: "${{ matrix.shard }}"
        spec:
          ttlSecondsAfterFinished: 3600
          backoffLimit: 3
          template:
            spec:
              restartPolicy: OnFailure
              containers:
              - name: migration
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migration-${{ needs.pre-migration-checks.outputs.migration_id }}
                env:
                - name: MIGRATION_ID
                  value: ${{ needs.pre-migration-checks.outputs.migration_id }}
                - name: SHARD_ID
                  value: "${{ matrix.shard }}"
                - name: REDIS_SOURCE_URL
                  valueFrom:
                    secretKeyRef:
                      name: redis-secrets
                      key: source-url
                - name: REDIS_TARGET_URL
                  valueFrom:
                    secretKeyRef:
                      name: redis-secrets
                      key: target-url
                - name: DRY_RUN
                  value: "${{ github.event.inputs.dry_run || 'false' }}"
                - name: LOG_LEVEL
                  value: "info"
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "250m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
                volumeMounts:
                - name: migration-logs
                  mountPath: /app/logs
              volumes:
              - name: migration-logs
                emptyDir: {}
        EOF

    - name: Wait for migration completion
      run: |
        echo "Waiting for migration shard ${{ matrix.shard }} to complete..."

        # Wait for job completion
        kubectl wait --for=condition=complete job/redis-migration-${{ needs.pre-migration-checks.outputs.migration_id }}-${{ matrix.shard }} \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          --timeout=${{ env.DEPLOYMENT_TIMEOUT }}s

    - name: Check migration status
      run: |
        echo "Checking migration status for shard ${{ matrix.shard }}..."

        # Get job logs
        kubectl logs job/redis-migration-${{ needs.pre-migration-checks.outputs.migration_id }}-${{ matrix.shard }} \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          --tail=100

        # Check job status
        STATUS=$(kubectl get job redis-migration-${{ needs.pre-migration-checks.outputs.migration_id }}-${{ matrix.shard }} \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')

        if [[ "${STATUS}" != "True" ]]; then
          echo "❌ Migration shard ${{ matrix.shard }} failed"
          kubectl describe job redis-migration-${{ needs.pre-migration-checks.outputs.migration_id }}-${{ matrix.shard }} \
            --namespace=${{ github.event.inputs.environment || 'staging' }}
          exit 1
        fi

        echo "✅ Migration shard ${{ matrix.shard }} completed successfully"

  # Blue-Green deployment switch
  switch-traffic:
    name: Switch Traffic (Blue-Green)
    runs-on: ubuntu-latest
    needs: [pre-migration-checks, execute-migration]
    if: |
      needs.pre-migration-checks.outputs.can_proceed == 'true' &&
      github.event.inputs.migration_strategy == 'blue-green' &&
      github.event.inputs.verify_only != 'true'
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.app_url }}

    steps:
    - name: Deploy Green Environment
      id: deploy
      run: |
        echo "Deploying green environment..."

        # Update deployment to use target Redis
        kubectl patch deployment workshopsai-cms \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          -p '{"spec":{"template":{"spec":{"containers":[{"name":"app","env":[{"name":"REDIS_URL","valueFrom":{"secretKeyRef":{"name":"redis-secrets","key":"target-url"}}}]}]}}}}'

        # Wait for rollout
        kubectl rollout status deployment/workshopsai-cms \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          --timeout=${{ env.DEPLOYMENT_TIMEOUT }}s

        echo "app_url=https://${{ github.event.inputs.environment || 'staging' }}.workshopsai.com" >> $GITHUB_OUTPUT

    - name: Health Check
      run: |
        echo "Performing health check on green environment..."

        # Wait for pods to be ready
        kubectl wait --for=condition=ready pod -l app=workshopsai-cms \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}s

        # Perform health check
        for i in {1..30}; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ github.event.inputs.environment || 'staging' }}.workshopsai.com/health)

          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "✅ Health check passed"
            break
          fi

          if [[ $i -eq 30 ]]; then
            echo "❌ Health check failed after 30 attempts"
            exit 1
          fi

          sleep 10
        done

    - name: Switch Service to Green
      run: |
        echo "Switching service traffic to green environment..."

        # Update service selector
        kubectl patch service workshopsai-cms \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          -p '{"spec":{"selector":{"version":"green"}}}'

    - name: Update Ingress (if applicable)
      run: |
        # Update ingress annotations if using weighted routing
        kubectl annotate ingress workshopsai-cms \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          nginx.ingress.kubernetes.io/canary-weight="100" \
          nginx.ingress.kubernetes.io/canary-by-cookie="canary" || echo "No ingress update needed"

  # Verify migration
  verify-migration:
    name: Verify Migration
    runs-on: ubuntu-latest
    needs: [pre-migration-checks, execute-migration, switch-traffic]
    if: |
      needs.pre-migration-checks.outputs.can_proceed == 'true' &&
      github.event.inputs.verify_only != 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run migration verification
      run: |
        echo "Running migration verification..."

        node infra/migration/redis-migrate.js \
          --source "${{ secrets.REDIS_SOURCE_URL }}" \
          --target "${{ secrets.REDIS_TARGET_URL }}" \
          --verify \
          --log-level info

    - name: Run application integration tests
      run: |
        echo "Running application integration tests..."

        # Run smoke tests against the new environment
        npm run test:smoke

    - name: Performance comparison
      run: |
        echo "Running performance comparison..."

        # Run performance tests
        npm run test:performance

        # Compare results with baseline
        node scripts/compare-performance.js

  # Cleanup and rollback preparation
  cleanup:
    name: Cleanup and Prepare Rollback
    runs-on: ubuntu-latest
    needs: [verify-migration]
    if: |
      always() &&
      needs.verify-migration.result == 'success'

    steps:
    - name: Cleanup migration jobs
      run: |
        echo "Cleaning up migration jobs..."

        # Delete migration jobs
        kubectl delete job -l app=redis-migration \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          --ignore-not-found=true

    - name: Create rollback snapshot
      run: |
        echo "Creating rollback snapshot..."

        # Save current state for potential rollback
        kubectl get deployment workshopsai-cms \
          --namespace=${{ github.event.inputs.environment || 'staging' }} \
          -o yaml > rollback-${{ needs.pre-migration-checks.outputs.migration_id }}.yaml

        # Upload snapshot as artifact
        mkdir -p artifacts
        cp rollback-${{ needs.pre-migration-checks.outputs.migration_id }}.yaml artifacts/

    - name: Upload rollback artifact
      uses: actions/upload-artifact@v4
      with:
        name: rollback-snapshot-${{ needs.pre-migration-checks.outputs.migration_id }}
        path: artifacts/
        retention-days: 30

  # Notify teams
  notify:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: [pre-migration-checks, execute-migration, verify-migration]
    if: always()

    steps:
    - name: Notify Slack on Success
      if: needs.verify-migration.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: |
          ✅ Redis Migration Completed Successfully!
          🚀 Environment: ${{ github.event.inputs.environment || 'staging' }}
          📦 Migration ID: ${{ needs.pre-migration-checks.outputs.migration_id }}
          🔀 Strategy: ${{ github.event.inputs.migration_strategy || 'blue-green' }}
          👤 Triggered by: ${{ github.actor }}

    - name: Notify Slack on Failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: |
          ❌ Redis Migration Failed!
          🚨 Environment: ${{ github.event.inputs.environment || 'staging' }}
          📦 Migration ID: ${{ needs.pre-migration-checks.outputs.migration_id }}
          🔀 Strategy: ${{ github.event.inputs.migration_strategy || 'blue-green' }}
          👤 Triggered by: ${{ github.actor }}
          🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}