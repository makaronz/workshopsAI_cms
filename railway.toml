# Railway.app Configuration for WorkshopsAI CMS
# Optimized for successful deployment with graceful degradation
# Updated: 2025-12-13 - Aligned with healthcheck improvements

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.production"  # Uses multi-stage Alpine build

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"  # Always returns 200 OK (graceful degradation)
healthcheckTimeout = 100  # 100 seconds - app responds in <2s (Redis timeout), but Railway needs buffer
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "app"

[services.variables]
NODE_ENV = "production"
PORT = "3010"  # Matches src/index.ts: process.env['PORT'] || 3010
